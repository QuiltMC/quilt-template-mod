plugins {
	id 'maven-publish'
	alias libs.plugins.quilt.loom
}

base {
	archivesName = project.archives_base_name
}

version = "$project.version+${libs.minecraft.get().version}"
group = project.maven_group

final dataGenerationDir = file("src/main/generated")

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

sourceSets {
	"main" {
		resources {
			srcDirs(dataGenerationDir)
		}
	}
}

loom {
	// Loom and Loader both use this block in order to gather more information about your mod.
	mods {
		// This should match your mod id.
		"example_mod" {
			// Tell Loom about each source set used by your mod here. This ensures that your mod's classes are properly transformed by Loader.
			sourceSet("main")
			// If you shade (directly include classes, not JiJ) a dependency into your mod, include it here using one of these methods:
			// dependency("com.example.shadowedmod:1.2.3")
			// configuration("exampleShadedConfigurationName")
		}
	}

	runs {
		"dataGeneration" {
			final buildDir = file("build/datagen")

			configName = "Fabric Data Generation"
			dataGenerationDir.mkdirs()
			buildDir.mkdirs()

			client()
			source("main")
			property("fabric-api.datagen")
			property("fabric-api.datagen.strict-validation", "true")
			property("fabric-api.datagen.output-dir", dataGenerationDir.absolutePath)

			runDir("build/datagen")
		}
	}
}

// All the dependencies are declared at gradle/libs.version.toml and referenced with "libs.<id>"
// See https://docs.gradle.org/current/userguide/platforms.html for information on how version catalogs work.
dependencies {
	minecraft libs.minecraft
	mappings variantOf(libs.quilt.mappings) { classifier 'intermediary-v2' }
	// Replace the above line with the block below if you want to use Mojang mappings as your primary mappings, falling back on QM for parameters and Javadocs
	/*
	mappings loom.layered {
		mappings "org.quiltmc:quilt-mappings:${libs.versions.quilt.mappings.get()}:intermediary-v2"
		officialMojangMappings()
	}
	*/
	modImplementation libs.quilt.loader

	// QSL is not a complete API; You will need Quilted Fabric API to fill in the gaps.
	// Quilted Fabric API will automatically pull in the correct QSL version.
	modImplementation libs.bundles.quilted.fabric.api
	// modImplementation libs.bundles.quilted.fabric.api.deprecated // If you wish to use Fabric API's deprecated modules, you can replace the above line with this one
}

final generateDataGenerationDir = "generateDataGenerationDir"

tasks {
	processResources {
		inputs.properties 'version': version, 'group': project.group

		filesMatching('quilt.mod.json') {
			expand 'version': version, 'group': project.group, 'id': archives_base_name
		}

		filesMatching('**/lang/*.json') {
			expand 'id': archives_base_name
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.encoding = 'UTF-8'
		// Minecraft 1.20.5 (24w14a) upwards uses Java 21.
		it.options.release = 21
	}

	javadoc {
		options.encoding = "UTF-8"
	}

	// Run `./gradlew wrapper --gradle-version <newVersion>` or `gradle wrapper --gradle-version <newVersion>` to update gradle scripts
	// BIN distribution should be sufficient for the majority of mods
	wrapper {
		distributionType = Wrapper.DistributionType.BIN
	}

	// If you plan to use a different file for the license, don't forget to change the file name here!
	jar {
		from('LICENSE') {
			rename { "${it}_${archives_base_name}" }
		}
	}


	ideaSyncTask {
		finalizedBy(generateDataGenerationDir)
	}

	"runDataGeneration" {
		dependsOn(generateDataGenerationDir)
	}
}

tasks.register(generateDataGenerationDir) {
	inputs.dir dataGenerationDir

	doFirst {
		for (file in inputs.files) file.mkdirs()
	}
}

java {
	// Still required by IDEs such as Eclipse and Visual Studio Code
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21

	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// If this mod is going to be a library, then it should also generate Javadocs in order to aid with development.
	// Uncomment this line to generate them.
	// withJavadocJar()
}

// Configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
